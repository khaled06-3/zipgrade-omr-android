[package]
name = "zipgrade-omr-core"
version = "2.2.0"
edition = "2021"
description = "Zero-allocation Rust OMR Computer Vision Engine (Integral Luma + 3x3 Seed-Lattice 6-Fiducial BFS + Direct Inverse Bilinear Disc Sampling)"
license = "MIT"

[lib]
name = "omr_rust_core"
